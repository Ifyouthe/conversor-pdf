# Conversor PDF Sumate.
# Base neutra: sin puertos publicados, sin redes ni etiquetas de Traefik. Cada
# servidor pone lo suyo en un override (en el 207: docker-compose.207.yml).
# Variables en .env (600); ver .env.example.
services:
  conversor-pdf:
    build: .
    restart: unless-stopped
    expose:
      - "3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      # Secreto compartido: los clientes mandan la cabecera X-API-Key
      - CONVERSOR_API_KEY=${CONVERSOR_API_KEY:-}
      - ILOVEPDF_PUBLIC_KEY=${ILOVEPDF_PUBLIC_KEY:-}
      - ILOVEPDF_SECRET_KEY=${ILOVEPDF_SECRET_KEY:-}
      - CONSTRUCTOR_DOCUMENTOS_URL=${CONSTRUCTOR_DOCUMENTOS_URL:-http://constructor-documentos:3003}
      - CONSTRUCTOR_API_KEY=${CONSTRUCTOR_API_KEY:-}
      - DEFAULT_CONVERSION_METHOD=${DEFAULT_CONVERSION_METHOD:-puppeteer}
      - ENABLE_FALLBACK=${ENABLE_FALLBACK:-true}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-10}
      - TEMP_DIR=/tmp/pdf-converter
      - PUPPETEER_HEADLESS=new
      - PUPPETEER_TIMEOUT=60000
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
